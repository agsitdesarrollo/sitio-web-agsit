substitutions:
  _REGION: us-central1
  _SERVICE: agsit-web
  _ARTIFACT_REPOSITORY: agsit
  _IMAGE_NAME: agsit-web

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: Verify Astro build
    name: node:22-bookworm
    entrypoint: bash
    args:
      - -ceu
      - |
        corepack enable
        corepack prepare pnpm@11.1.1 --activate
        pnpm install --frozen-lockfile
        pnpm build

  - id: Build Cloud Run image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPOSITORY}/${_IMAGE_NAME}:${COMMIT_SHA}
      - --tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPOSITORY}/${_IMAGE_NAME}:latest
      - .

  - id: Push Cloud Run image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPOSITORY}/${_IMAGE_NAME}

  - id: Deploy Cloud Run contact service
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPOSITORY}/${_IMAGE_NAME}:${COMMIT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --service-account=agsit-web-runtime@${PROJECT_ID}.iam.gserviceaccount.com
      - --set-secrets=BITRIX_WEBHOOK_URL=BITRIX_WEBHOOK_URL:1
      - --min-instances=0
      - --max-instances=3
      - --cpu=1
      - --memory=512Mi
      - --concurrency=20
      - --timeout=15s
      - --allow-unauthenticated
      - --quiet

  - id: Deploy Firebase Hosting
    name: node:22-bookworm
    entrypoint: bash
    args:
      - -ceu
      - |
        npm install --global firebase-tools@13.31.2
        firebase deploy --only hosting --project ${PROJECT_ID} --non-interactive

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPOSITORY}/${_IMAGE_NAME}:${COMMIT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPOSITORY}/${_IMAGE_NAME}:latest
